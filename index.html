<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gestion ventes et stock</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f4f6;--card:#fff;--ink:#1a1d23;--mute:#5f6673;--line:#e2e5ea;--bd:#cfd3da;--acc:#f7941d;--accx:#1a1d23;--warn:#c2410c;--ok:#15803d;--side:#16181d;--sidei:#c3c8d1;--sidel:#262930;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1114;--card:#181b20;--ink:#eceef1;--mute:#9ba1ad;--line:#262a32;--bd:#363b45;--accx:#14161a;--warn:#fb923c;--ok:#4ade80;--side:#0b0c0f;--sidel:#1d2026}}
:root[data-theme="dark"]{--bg:#0f1114;--card:#181b20;--ink:#eceef1;--mute:#9ba1ad;--line:#262a32;--bd:#363b45;--accx:#14161a;--warn:#fb923c;--ok:#4ade80;--side:#0b0c0f;--sidel:#1d2026}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14.5px/1.5 'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
.wrap{min-height:100vh}
header{position:sticky;top:0;z-index:5;background:var(--side);color:var(--sidei);display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:12px 16px 0}
header .row{display:contents}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto}.logo{display:block;height:32px;width:auto}
h1{font-size:15px;font-weight:600;margin:0;color:#fff;letter-spacing:.01em;line-height:1.25}
header select{background:var(--sidel);color:#fff;border-color:transparent}
nav{order:3;flex:0 0 100%;display:flex;gap:2px;overflow-x:auto;margin:0 -16px;padding:0 10px;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{display:flex;align-items:center;gap:10px;white-space:nowrap;border:0;border-bottom:2px solid transparent;background:none;color:var(--sidei);font:inherit;font-weight:500;padding:11px 12px;cursor:pointer;transition:color .15s,background .15s}
nav button:hover{color:#fff}
nav button.on{color:#fff;border-bottom-color:var(--acc)}
nav svg{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;pointer-events:none;display:none}
.content{padding:18px 16px 32px;max-width:1120px}
.ptitle{font-size:22px;font-weight:600;letter-spacing:-.01em;margin:2px 0 16px}
@media(min-width:1000px){
  .wrap{display:grid;grid-template-columns:240px 1fr}
  header{height:100vh;height:100dvh;flex-direction:column;flex-wrap:nowrap;align-items:stretch;gap:0;padding:22px 12px 18px}
  header .row{display:flex;flex-direction:column;flex:1;min-height:0}
  .brand{margin:0 6px 22px}.logo{height:36px}
  nav{order:0;flex:none;flex-direction:column;overflow:visible;margin:0;padding:0;gap:2px}
  nav button{border-bottom:0;border-left:3px solid transparent;border-radius:0 8px 8px 0;padding:10px 12px}
  nav button:hover{background:rgba(255,255,255,.05)}
  nav button.on{background:var(--sidel);border-left-color:var(--acc)}
  nav svg{display:block}
  nav button.on svg{stroke:var(--acc)}
  header select{order:2;margin-top:auto}
  .content{padding:30px 40px 48px}
  .ptitle{font-size:26px;margin-bottom:20px}
}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px 20px;margin-bottom:16px}
h2{font-size:15px;font-weight:600;margin:0 0 14px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-bottom:16px}
.kpi{background:var(--card);padding:14px 18px;display:flex;flex-direction:column-reverse}
.kpi b{display:block;font-size:22px;font-weight:600;letter-spacing:-.01em}
.kpi span{color:var(--mute);font-size:12.5px}
.kpi.w b{color:var(--warn)}
.bars{display:flex;align-items:flex-end;gap:10px;height:170px}
.bar{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;font-size:12px;color:var(--mute)}
.bar i{display:block;width:100%;background:var(--acc);border-radius:4px 4px 0 0;min-height:2px}
.bar em{font-style:normal;margin-bottom:3px}
.bar span{margin-top:4px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
input,select{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:8px 11px;min-width:0;transition:border-color .15s}
input:hover,select:hover{border-color:var(--mute)}
input:focus-visible,select:focus-visible{outline:2px solid var(--acc);outline-offset:0;border-color:var(--acc)}
button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.grow{flex:1 1 180px}
.btn{font:inherit;font-weight:600;border:1px solid var(--acc);background:var(--acc);color:var(--accx);border-radius:8px;padding:8px 15px;cursor:pointer;transition:filter .15s,background .15s}
.btn:hover{filter:brightness(.94)}
.btn.g{background:var(--card);color:var(--ink);border-color:var(--bd)}
.btn.g:hover{background:var(--bg);filter:none}
.btn.s{padding:4px 10px;font-size:13px}
.btn.d{background:var(--card);color:var(--warn);border-color:var(--bd)}
.btn.d:hover{background:var(--bg);filter:none}
.btn:disabled{opacity:.5;cursor:not-allowed}
.chk{width:18px;height:18px;accent-color:var(--acc)}.sub{display:block;font-size:12px;color:var(--mute)}.pos{color:var(--ok)}.neg{color:var(--warn)}
.posg{display:grid;grid-template-columns:1fr 130px;gap:14px}.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px;align-content:start}
.tile{min-height:96px;display:flex;flex-direction:column;justify-content:space-between;align-items:center;text-align:center;gap:4px;border:1px solid var(--bd);background:var(--card);color:var(--ink);border-radius:8px;padding:10px 8px;font:inherit;font-size:13px;font-weight:500;cursor:pointer;transition:border-color .15s,background .15s}
.tile:hover:not(:disabled){border-color:var(--acc)}
.tile b{font-size:15px;font-weight:600}.tile small{color:var(--mute);font-size:11.5px;font-weight:400}.tile.lw small{color:var(--warn)}
.tile.on{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 12%,var(--card));box-shadow:inset 0 0 0 1px var(--acc)}
.tile:disabled{opacity:.45;cursor:not-allowed}
.cats{display:flex;flex-direction:column;gap:6px}.cats .btn{padding:9px 8px;white-space:normal;text-align:left}.btn.g.on{background:var(--acc);color:var(--accx);border-color:var(--acc)}
.cart{margin-top:16px}.cart>div{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}.cart>div.row{border:0;padding:0}.cart .cq{white-space:nowrap}
@media(max-width:640px){.posg{grid-template-columns:1fr}.cats{order:-1;flex-direction:row;overflow-x:auto}.cats .btn{white-space:nowrap}}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
table{width:100%;border-collapse:collapse;min-width:560px}
th,td{text-align:left;padding:11px 12px;border-bottom:1px solid var(--line)}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover td{background:color-mix(in srgb,var(--bg) 60%,transparent)}
th{font-size:12.5px;color:var(--mute);font-weight:600;white-space:nowrap;background:color-mix(in srgb,var(--bg) 70%,var(--card))}
th[data-s]{cursor:pointer}
tfoot th{color:var(--ink);border-top:1px solid var(--bd);border-bottom:0}
td.n,th.n{text-align:right}
.tag{display:inline-block;padding:2px 9px;border-radius:6px;font-size:12px;font-weight:600;background:color-mix(in srgb,var(--ok) 15%,transparent);color:var(--ok)}
.tag.w{background:color-mix(in srgb,var(--warn) 15%,transparent);color:var(--warn)}
.empty{color:var(--mute);padding:20px 14px}
dialog{border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);padding:22px;width:min(460px,92vw);box-shadow:0 24px 60px rgba(0,0,0,.28)}
dialog::backdrop{background:rgba(10,12,16,.55)}
.f{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.f label{display:flex;flex-direction:column;font-size:13px;color:var(--mute);gap:4px}
.f .full{grid-column:1/-1}
.list div{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:700px){.two{grid-template-columns:1fr}}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-weight:500;z-index:99;max-width:90vw;display:none;box-shadow:0 8px 24px rgba(0,0,0,.25)}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

    <nav id="nav"><button data-v="dash" class="on"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="9"/><rect x="14" y="3" width="7" height="5"/><rect x="14" y="12" width="7" height="9"/><rect x="3" y="16" width="7" height="5"/></svg>Tableau de bord</button><button data-v="stock"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 8l-9-5-9 5v8l9 5 9-5z"/><path d="M3 8l9 5 9-5M12 13v8"/></svg>Stock</button><button data-v="mov"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 7h13l-4-4M17 17H4l4 4"/></svg>Mouvements</button><button data-v="sales"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="20" r="1.5"/><circle cx="18" cy="20" r="1.5"/><path d="M2 3h3l2.7 12.4a1 1 0 001 .8h9.6a1 1 0 001-.8L21 7H6"/></svg>Ventes</button><button data-v="cash"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="6" width="20" height="12" rx="2"/><circle cx="12" cy="12" r="2.5"/></svg>Caisse</button><button data-v="ben"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 17l6-6 4 4 8-8M15 7h6v6"/></svg>Bénéfices</button><button data-v="rep"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 3H7a2 2 0 00-2 2v14a2 2 0 002 2h10a2 2 0 002-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h6"/></svg>Rapports</button></nav>
  </div>
</header>
<div class="content"><div class="ptitle" id="ptitle"></div><main id="app"></main></div>
</div>

<dialog id="dlg"><form method="dialog" id="pf" class="f">
  <h2 class="full" id="dt">Produit</h2>
  <label class="full">Nom<input id="pn"></label>
  <label>Référence<input id="pr"></label>
  <label>Catégorie<input id="pc"></label>
  <label>Prix d'achat<input id="pa" inputmode="decimal" autocomplete="off"></label>
  <label>Prix de vente<input id="pp" inputmode="decimal" autocomplete="off"></label>
  <label>Quantité en stock<input id="pq" inputmode="numeric" autocomplete="off"></label>
  <div class="full" id="pb" style="font-size:13px;color:var(--mute)"></div>
  <label class="full">Alerte si stock sous<input id="pm" inputmode="numeric" value="5" autocomplete="off"></label>
  <div class="full"><b style="font-size:13px">Offres de quantité (ex. 3 pour 25)</b><div id="ofl" class="row" style="margin:6px 0"></div>
    <div class="row" style="margin:0"><input id="on" inputmode="numeric" placeholder="Quantité (ex. 3)" style="width:130px" autocomplete="off"><input id="op" inputmode="decimal" placeholder="Prix total (ex. 25)" style="width:150px" autocomplete="off"><button type="button" class="btn g s" id="oadd">Ajouter l'offre</button></div></div>
  <div class="full row" style="justify-content:flex-end;margin:6px 0 0"><button type="button" class="btn g" id="cx">Annuler</button><button type="button" class="btn" id="sv">Enregistrer</button></div>
</form></dialog>

<dialog id="cdlg"><p id="cm" style="margin:0 0 16px;font-weight:600"></p><div class="row" style="justify-content:flex-end;margin:0"><button class="btn g" id="cn">Non</button><button class="btn" id="cy">Oui</button></div></dialog>
<div id="toast" role="status"></div>
<script>
const K='gestion-v1';
const demo=()=>({cur:'EUR',products:[
{id:1,name:'Café moulu 250 g',ref:'CAF-01',cat:'Épicerie',price:4.5,cost:3,qty:40,min:10},
{id:2,name:'Thé vert 100 g',ref:'THE-02',cat:'Épicerie',price:3.2,cost:2,qty:6,min:8},
{id:3,name:'Cahier A5',ref:'PAP-01',cat:'Papeterie',price:2.1,cost:1.2,qty:55,min:15},
{id:4,name:'Stylo bleu (lot de 10)',ref:'PAP-02',cat:'Papeterie',price:5.9,cost:3.8,qty:3,min:5}],
sales:[],next:10});
let S;try{S=JSON.parse(localStorage.getItem(K))}catch(e){}
if(!S||!S.products){S=demo();const d=new Date();[[1,3,6],[3,5,5],[2,1,4],[1,4,3],[4,2,2],[3,2,1],[1,2,0]].forEach(([p,q,ago],i)=>{const pr=S.products.find(x=>x.id==p);const t=new Date(d-ago*864e5);S.sales.push({id:i+1,pid:p,name:pr.name,qty:q,price:pr.price,cost:pr.cost,date:t.toISOString()})})}
S.products.forEach(p=>{if(p.cost===undefined)p.cost=null});
let _l=0;const nid=()=>{let n=Date.now()*1000+Math.floor(Math.random()*1000);if(n<=_l)n=_l+1;_l=n;return n};
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}if(window.cloudPush)window.cloudPush()};
let view='dash',q='',sq='',sort={k:'name',d:1},edit=null;
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const money=n=>{const c=S.cur||'EUR';return c=='HTG'?new Intl.NumberFormat('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}).format(n)+' HTG':new Intl.NumberFormat('fr-FR',{style:'currency',currency:c}).format(n)};
const st=s=>s.tot!=null?s.tot:s.qty*s.price;
const lineTotal=(p,q)=>{const O=(p.offers||[]).filter(o=>o.n>1&&o.price>=0);if(!O.length)return q*p.price;const d=[0];for(let i=1;i<=q;i++){let b=d[i-1]+p.price;O.forEach(o=>{if(i>=o.n)b=Math.min(b,d[i-o.n]+o.price)});d[i]=b}return d[q]};
const costOf=s=>{if(s.cost!=null)return s.cost;const p=S.products.find(x=>x.id==s.pid);return p&&p.cost!=null?p.cost:null};
const prof=s=>{const c=costOf(s);return c==null?0:st(s)-s.qty*c};
const inP=(s,p)=>{if(p=='all')return true;const a=new Date();a.setHours(0,0,0,0);if(p=='mois')a.setDate(1);else a.setDate(a.getDate()-(+p-1));return new Date(s.date)>=a};
function agg(L){const m={};L.forEach(s=>{const r=m[s.name]||(m[s.name]={name:s.name,pid:s.pid,qty:0,tot:0,gain:0,kt:0,ct:0}),c=costOf(s);r.qty+=s.qty;r.tot+=st(s);if(c!=null){r.gain+=prof(s);r.kt+=st(s);r.ct+=s.qty*c}});return Object.values(m).sort((a,b)=>b.tot-a.tot)}
const dt=s=>new Date(s).toLocaleDateString('fr-FR',{day:'2-digit',month:'short'});
const day=s=>new Date(s).toDateString();
const low=p=>p.qty<=p.min;

let dFrom,dTo;
function setRange(r){
  const t=new Date(),T=new Date(t.getFullYear(),t.getMonth(),t.getDate());dTo=ymd(T);
  if(r=='1')dFrom=dTo;
  else if(r=='7'||r=='30')dFrom=ymd(new Date(T.getFullYear(),T.getMonth(),T.getDate()-(+r-1)));
  else if(r=='mois')dFrom=ymd(new Date(T.getFullYear(),T.getMonth(),1));
  else dFrom=S.sales.length?S.sales.map(s=>ymd(s.date)).sort()[0]:dTo;
  render();
}
const inR=s=>{const k=ymd(s.date);return k>=dFrom&&k<=dTo};
function buckets(){
  const a=new Date(dFrom+'T00:00:00'),b=new Date(dTo+'T00:00:00'),n=Math.round((b-a)/864e5)+1,out=[];
  const byDay=n<=62;
  if(byDay)for(let i=0;i<n;i++){const d=new Date(a.getFullYear(),a.getMonth(),a.getDate()+i);out.push({k:ymd(d),l:n<=8?d.toLocaleDateString('fr-FR',{weekday:'short'}):String(d.getDate()),t:0,c:0})}
  else for(let d=new Date(a.getFullYear(),a.getMonth(),1);d<=b;d=new Date(d.getFullYear(),d.getMonth()+1,1))out.push({k:d.getFullYear()+'-'+z2(d.getMonth()+1),l:d.toLocaleDateString('fr-FR',{month:'short'}),t:0,c:0});
  S.sales.filter(inR).forEach(s=>{const k=byDay?ymd(s.date):ymd(s.date).slice(0,7),o=out.find(x=>x.k==k);if(o){o.t+=st(s);o.c++}});
  return {out,byDay};
}
function dash(){
  if(!dFrom){dFrom=ymd(Date.now()-6*864e5);dTo=ymd(new Date())}
  const SR=S.sales.filter(inR),gp=SR.reduce((a,s)=>a+prof(s),0),rev=SR.reduce((a,s)=>a+st(s),0),art=SR.reduce((a,s)=>a+s.qty,0);
  const val=S.products.reduce((a,p)=>a+p.qty*p.price,0),lw=S.products.filter(low);
  const {out,byDay}=buckets(),mx=Math.max(1,...out.map(x=>x.t)),step=Math.ceil(out.length/12);
  const top={};SR.forEach(s=>{top[s.name]=(top[s.name]||0)+st(s)});
  const tp=Object.entries(top).sort((a,b)=>b[1]-a[1]).slice(0,5);
  const lab=dFrom==dTo?longDay(dFrom):'du '+new Date(dFrom+'T00:00:00').toLocaleDateString('fr-FR')+' au '+new Date(dTo+'T00:00:00').toLocaleDateString('fr-FR');
  const q=[['1','Aujourd\'hui'],['7','7 jours'],['30','30 jours'],['mois','Ce mois'],['all','Tout']].map(([v,t])=>`<button class="btn g s" data-r="${v}">${t}</button>`).join('');
  return `<div class="card"><h2>Période</h2><div class="row">${q}</div><div class="row" style="margin:0"><label>Du <input id="dfrom" type="date" value="${dFrom}"></label><label>Au <input id="dto" type="date" value="${dTo}"></label></div></div>
  <div class="kpis">
  <div class="kpi"><b>${money(rev)}</b><span>Chiffre d'affaires, ${lab}</span></div>
  <div class="kpi"><b>${money(gp)}</b><span>Bénéfice sur la période</span></div>
  <div class="kpi"><b>${SR.length}</b><span>Ventes sur la période</span></div>
  <div class="kpi"><b>${art}</b><span>Articles vendus</span></div>
  <div class="kpi"><b>${money(val)}</b><span>Valeur du stock</span></div>
  <div class="kpi ${lw.length?'w':''}"><b>${lw.length}</b><span>Produits à réapprovisionner</span></div></div>
  <div class="card"><h2>Chiffre d'affaires ${byDay?'par jour':'par mois'}</h2><div class="bars">${out.map((x,i)=>`<div class="bar" title="${x.k} : ${money(x.t)}"><em>${out.length<=10&&x.t?Math.round(x.t):''}</em><i style="height:${x.t/mx*80}%"></i><span>${i%step==0?x.l:''}</span></div>`).join('')}</div></div>
  <div class="card"><h2>Détail ${byDay?'par jour':'par mois'}</h2><div class="tw"><table style="min-width:360px"><thead><tr><th>${byDay?'Jour':'Mois'}</th><th class="n">Ventes</th><th class="n">Total</th></tr></thead><tbody>${out.filter(x=>x.c).reverse().map(x=>`<tr><td>${byDay?longDay(x.k):x.k}</td><td class="n">${x.c}</td><td class="n">${money(x.t)}</td></tr>`).join('')}</tbody><tfoot><tr><th>Total</th><th class="n">${SR.length}</th><th class="n">${money(rev)}</th></tr></tfoot></table>${SR.length?'':'<p class="empty">Aucune vente sur cette période.</p>'}</div></div>
  <div class="two"><div class="card"><h2>Meilleurs produits</h2><div class="list">${tp.length?tp.map(([n,v])=>`<div><span>${esc(n)}</span><b>${money(v)}</b></div>`).join(''):'<p class="empty">Aucune vente sur cette période.</p>'}</div></div>
  <div class="card"><h2>Stock faible</h2><div class="list">${lw.length?lw.map(p=>`<div><span>${esc(p.name)}</span><span class="tag w">${p.qty} restant${p.qty>1?'s':''}</span></div>`).join(''):'<p class="empty">Tous les stocks sont suffisants.</p>'}</div></div></div>`;
}

function stock(){
  const gn=p=>p.cost==null?null:p.price-p.cost,val=(p,k)=>{const v=k=='gain'?gn(p):p[k];return v==null?-Infinity:v};
  let L=S.products.filter(p=>(p.name+p.ref+p.cat).toLowerCase().includes(q.toLowerCase()));
  L.sort((a,b)=>{const x=val(a,sort.k),y=val(b,sort.k);return (x>y?1:x<y?-1:0)*sort.d});
  const th=(k,t,n)=>`<th class="${n?'n':''}" data-s="${k}">${t}${sort.k==k?(sort.d>0?' ▲':' ▼'):''}</th>`;
  return `<div class="card"><div class="row"><input id="q" class="grow" placeholder="Rechercher un produit, une référence, une catégorie" value="${esc(q)}" aria-label="Rechercher"><button class="btn" id="add">Ajouter un produit</button><button class="btn g" data-x2="stk">Exporter le stock</button></div>
  <p style="margin:0 0 10px;color:var(--mute);font-size:13px">Bénéfice possible du stock actuel : <b>${money(S.products.reduce((a,p)=>a+(p.cost==null?0:p.qty*(p.price-p.cost)),0))}</b></p>
  <div class="tw"><table style="min-width:1010px"><thead><tr>${th('name','Produit')}${th('ref','Réf.')}${th('cat','Catégorie')}${th('cost','Prix d\'achat',1)}${th('price','Prix de vente',1)}${th('gain','Bénéfice / unité',1)}<th class="n">Bénéfice du stock</th>${th('qty','Stock',1)}<th>État</th><th></th></tr></thead><tbody>
  ${L.map(p=>{const g=gn(p);return `<tr><td>${esc(p.name)}</td><td>${esc(p.ref)}</td><td>${esc(p.cat)}</td><td class="n">${p.cost==null?'—':money(p.cost)}</td><td class="n">${money(p.price)}</td><td class="n">${g==null?'—':`<span class="${g<0?'neg':'pos'}">${money(g)}</span><span class="sub">${p.price>0?Math.round(g/p.price*100)+' % de marge':''}</span>`}</td><td class="n">${g==null?'—':`<span class="${g<0?'neg':'pos'}">${money(g*p.qty)}</span>`}</td><td class="n">${p.qty}</td><td><span class="tag ${low(p)?'w':''}">${low(p)?'Stock faible':'OK'}</span></td><td class="n" style="white-space:nowrap"><button class="btn g s" data-e="${p.id}">Modifier</button> <button class="btn d s" data-x="${p.id}">Supprimer</button></td></tr>`}).join('')}
  </tbody></table>${L.length?'':'<p class="empty">Aucun produit trouvé. Ajoutez-en un pour commencer.</p>'}</div></div>`;
}

let selS=new Set();
const salesList=()=>[...S.sales].reverse().filter(s=>s.name.toLowerCase().includes(sq.toLowerCase()));
const selIds=()=>salesList().filter(s=>selS.has(s.id)).map(s=>s.id);
function updSel(){const n=selIds().length,b=$('#bulk'),a=$('#selall');if(b){b.disabled=!n;b.textContent=n?'Supprimer la sélection ('+n+')':'Supprimer la sélection'}if(a){const t=salesList().length;a.checked=n>0&&n==t;a.indeterminate=n>0&&n<t}}
let cart={},scat='';
const catOf=p=>p.cat||'Sans catégorie',catList=()=>[...new Set(S.products.map(catOf))].sort();
function posHtml(){
  const cats=catList(),L=S.products.filter(p=>!scat||catOf(p)==scat);
  const items=Object.entries(cart).map(([id,n])=>[S.products.find(p=>p.id==id),n]).filter(([p])=>p),tot=items.reduce((a,[p,n])=>a+lineTotal(p,n),0);
  return `<div class="posg"><div class="tiles">${L.map(p=>{const n=cart[p.id]||0;return `<button class="tile ${n?'on':''} ${low(p)?'lw':''}" data-t="${p.id}" ${n>=p.qty?'disabled':''}><span>${esc(p.name)}</span><b>${money(p.price)}</b>${(p.offers||[]).length?'<small>'+p.offers.map(o=>o.n+' pour '+money(o.price)).join(' · ')+'</small>':''}<small>${p.qty} en stock${n?' · ×'+n:''}</small></button>`}).join('')||'<p class="empty">Aucun produit. Ajoutez-en dans Stock.</p>'}</div>
  <div class="cats"><button class="btn g s ${!scat?'on':''}" data-k="-1">Tous</button>${cats.map((c,i)=>`<button class="btn g s ${scat==c?'on':''}" data-k="${i}">${esc(c)}</button>`).join('')}</div></div>
  <div class="cart">${items.length?items.map(([p,n])=>`<div><span>${esc(p.name)}${lineTotal(p,n)<p.price*n-1e-9?'<span class="sub">Offre appliquée : -'+money(p.price*n-lineTotal(p,n))+'</span>':''}</span><span class="cq"><button class="btn g s" data-m="${p.id}" aria-label="Moins">−</button> ${n} <button class="btn g s" data-pl="${p.id}" ${n>=p.qty?'disabled':''} aria-label="Plus">+</button></span><b>${money(lineTotal(p,n))}</b><button class="btn d s" data-rm="${p.id}" aria-label="Retirer">✕</button></div>`).join('')+`<div><b>Total</b><b>${money(tot)}</b></div><div class="row" style="margin:10px 0 0;justify-content:flex-end"><button class="btn g" id="clr">Vider</button><button class="btn" id="valid">Valider la vente</button></div>`:'<p class="empty">Touchez un article pour l\'ajouter à la vente.</p>'}</div>`;
}
function sales(){
  const av=S.products.filter(p=>p.qty>0),L=salesList();
  return `<div class="card"><h2>Nouvelle vente</h2>${posHtml()}</div>
  <div class="card"><div class="row"><input id="sq" class="grow" placeholder="Rechercher dans les ventes" value="${esc(sq)}" aria-label="Rechercher"><button class="btn d" id="bulk" disabled>Supprimer la sélection</button><button class="btn g" data-x2="sal">Exporter les ventes</button></div>
  <div class="tw"><table><thead><tr><th><input type="checkbox" class="chk" id="selall" aria-label="Tout sélectionner"></th><th>Date</th><th>Produit</th><th class="n">Qté</th><th class="n">Total</th><th></th></tr></thead><tbody>
  ${L.map(s=>`<tr><td><input type="checkbox" class="chk" data-c="${s.id}" ${selS.has(s.id)?'checked':''} aria-label="Sélectionner"></td><td>${dt(s.date)}</td><td>${esc(s.name)}</td><td class="n">${s.qty}</td><td class="n">${money(st(s))}</td><td class="n"><button class="btn d s" data-u="${s.id}">Supprimer</button></td></tr>`).join('')}
  </tbody></table>${L.length?'':'<p class="empty">Aucune vente. Enregistrez la première ci-dessus.</p>'}</div></div>`;
}

const z2=x=>String(x).padStart(2,'0');
const ymd=d=>{d=new Date(d);return d.getFullYear()+'-'+z2(d.getMonth()+1)+'-'+z2(d.getDate())};
const longDay=k=>new Date(k+'T00:00:00').toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
const hour=s=>new Date(s).toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});
let dsel=ymd(new Date());
const dayList=()=>S.sales.filter(s=>ymd(s.date)==dsel);
function dayCard(){
  const L=dayList(),tot=L.reduce((a,s)=>a+st(s),0),n=L.reduce((a,s)=>a+s.qty,0);
  const by={};S.sales.forEach(s=>{const k=ymd(s.date);by[k]=(by[k]||0)+st(s)});
  const D=Object.entries(by).sort((a,b)=>b[0].localeCompare(a[0]));
  return `<div class="card"><h2>Ventes d'un jour</h2><div class="row"><input id="dsel" type="date" value="${dsel}" aria-label="Choisir un jour"><button class="btn g s" data-x2="today">Aujourd'hui</button><button class="btn" data-p="day">Enregistrer en PDF</button><button class="btn g" data-x2="day">CSV</button></div>
  <p style="margin:0 0 12px;color:var(--mute)">${longDay(dsel)}</p>
  <div class="kpis"><div class="kpi"><b>${money(tot)}</b><span>Chiffre d'affaires du jour</span></div><div class="kpi"><b>${L.length}</b><span>Ventes enregistrées</span></div><div class="kpi"><b>${n}</b><span>Articles vendus</span></div></div>
  <h2 style="font-size:15px">Quantité vendue par article</h2><div class="tw"><table style="min-width:360px"><thead><tr><th>Article</th><th class="n">Quantité</th><th class="n">Total</th></tr></thead><tbody>${agg(L).map(r=>`<tr><td>${esc(r.name)}</td><td class="n">${r.qty}</td><td class="n">${money(r.tot)}</td></tr>`).join('')}</tbody></table></div><h2 style="font-size:15px;margin-top:16px">Détail des ventes</h2><div class="tw"><table><thead><tr><th>Heure</th><th>Produit</th><th class="n">Qté</th><th class="n">Total</th></tr></thead><tbody>${L.map(s=>`<tr><td>${hour(s.date)}</td><td>${esc(s.name)}</td><td class="n">${s.qty}</td><td class="n">${money(st(s))}</td></tr>`).join('')}</tbody><tfoot><tr><th colspan="2">Total du jour</th><th class="n">${n}</th><th class="n">${money(tot)}</th></tr></tfoot></table>${L.length?'':'<p class="empty">Aucune vente ce jour-là.</p>'}</div></div>
  <div class="card"><h2>Chiffre d'affaires par jour</h2><div class="tw"><table style="min-width:360px"><thead><tr><th>Jour</th><th class="n">Total</th><th></th></tr></thead><tbody>${D.map(([k,v])=>`<tr><td>${longDay(k)}</td><td class="n">${money(v)}</td><td class="n"><button class="btn g s" data-d="${k}">Voir</button></td></tr>`).join('')}</tbody></table>${D.length?'':'<p class="empty">Aucune vente enregistrée.</p>'}</div></div>`;
}
let per='7';
const inPer=s=>inP(s,per);
function repData(){return agg(S.sales.filter(inPer))}
function reports(){
  const R=repData(),tot=R.reduce((a,r)=>a+r.tot,0),n=R.reduce((a,r)=>a+r.qty,0);

    pdfSave('rapport-benefices-'+bp+'-'+stamp()+'.pdf','Rapport des bénéfices',PL[bp],['Chiffre d\'affaires : '+money(sm('tot')),'Coût d\'achat : '+money(sm('ct')),{t:'Bénéfice : '+money(sm('gain')),f:'F2'},'Bénéfice possible si tout le stock est vendu : '+money(pot),'',...tbl([{h:'Article',w:28},{h:'Qté',w:7,r:1},{h:'Chiffre d\'aff.',w:16,r:1},{h:'Coût d\'achat',w:16,r:1},{h:'Bénéfice',w:16,r:1}],R.map(r=>[r.name,r.qty,money(r.tot),money(r.ct),money(r.gain)]),['Total',sm('qty'),money(sm('tot')),money(sm('ct')),money(sm('gain'))])])}
}
function render(){
  $('#app').innerHTML={dash,stock,mov:moves,sales,cash:cashView,ben:benefits,rep:reports}[view]();
  $('#ptitle').textContent={dash:'Tableau de bord',stock:'Stock',mov:'Mouvements de stock',sales:'Ventes',cash:'Caisse',ben:'Bénéfices',rep:'Rapports'}[view];
  const rg=()=>{let f=$('#dfrom').value,t=$('#dto').value;if(!f||!t)return;if(f>t)[f,t]=[t,f];dFrom=f;dTo=t;render()};
  const d1=$('#dfrom'),d2=$('#dto');if(d1){d1.onchange=rg;d2.onchange=rg}
  const ds=$('#dsel');if(ds)ds.onchange=e=>{dsel=e.target.value||ymd(new Date());render()};
  const bs=$('#bper');if(bs)bs.onchange=e=>{bp=e.target.value;render()};
  const pe=$('#per');if(pe)pe.onchange=e=>{per=e.target.value;render()};
  const rf=$('#rf');if(rf)rf.onchange=e=>{
    const f=e.target.files[0];if(!f)return;const r=new FileReader();
    r.onload=()=>{try{const o=JSON.parse(r.result);if(!Array.isArray(o.products)||!Array.isArray(o.sales))throw 0;
      ask('Remplacer toutes les données actuelles par cette sauvegarde ?',()=>{S=o;save();render();note('Sauvegarde restaurée')})}catch(x){note("Ce fichier n'est pas une sauvegarde valide.")}};
    r.readAsText(f)};
  document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.v==view));
  $('#cur').value=S.cur||'EUR';updSel();
  const a=$('#q');if(a)a.oninput=e=>{q=e.target.value;const p=e.target.selectionStart;render();const n=$('#q');n.focus();n.setSelectionRange(p,p)};
  const b=$('#sq');if(b)b.oninput=e=>{sq=e.target.value;const p=e.target.selectionStart;render();const n=$('#sq');n.focus();n.setSelectionRange(p,p)};
}

function openP(p){
  edit=p?p.id:null;$('#dt').textContent=p?'Modifier le produit':'Ajouter un produit';
  $('#pn').value=p?p.name:'';$('#pr').value=p?p.ref:'';$('#pc').value=p?p.cat:'';
  tmpO=p&&p.offers?p.offers.map(o=>({n:o.n,price:o.price})):[];$('#on').value=$('#op').value='';renderO();$('#pa').value=p&&p.cost!=null?p.cost:'';$('#pp').value=p?p.price:'';$('#pq').value=p?p.qty:'';$('#pm').value=p?p.min:5;$('#dlg').showModal();upB();
}
let cb=null,tt;
function ask(msg,ok){cb=ok;$('#cm').textContent=msg;$('#cdlg').showModal()}
function note(msg){const t=$('#toast');t.textContent=msg;t.style.display='block';clearTimeout(tt);tt=setTimeout(()=>t.style.display='none',3500)}
$('#cn').onclick=()=>{cb=null;$('#cdlg').close()};
$('#cy').onclick=()=>{const f=cb;cb=null;$('#cdlg').close();if(f)f()};
$('#cx').onclick=()=>$('#dlg').close();
const num=v=>{v=String(v==null?'':v).trim().replace(/\s/g,'');if(v==='')return NaN;if(v.includes(',')&&v.includes('.'))v=v.replace(/,/g,'');else if(/^\d{1,3}(,\d{3})+$/.test(v))v=v.replace(/,/g,'');else v=v.replace(',','.');return Number(v)};
const upB=()=>{const a=num($('#pa').value),v=num($('#pp').value),b=$('#pb');b.style.color='var(--mute)';b.textContent=!isNaN(a)&&!isNaN(v)?'Bénéfice par unité : '+money(v-a):''};
$('#pa').oninput=$('#pp').oninput=upB;
let tmpO=[];
const renderO=()=>{$('#ofl').innerHTML=tmpO.length?tmpO.map((o,i)=>`<span class="tag">${o.n} pour ${money(o.price)} <button type="button" data-ro="${i}" style="border:0;background:none;cursor:pointer;color:inherit" aria-label="Retirer l'offre">✕</button></span>`).join(' '):'<span style="font-size:13px;color:var(--mute)">Aucune offre</span>'};
const addO=()=>{const n=num($('#on').value),pr=num($('#op').value),b=$('#pb');if(!(n>=2)||n%1||isNaN(pr)||pr<0){b.style.color='var(--warn)';b.textContent='Offre invalide : quantité entière (2 ou plus) et prix total.';return false}
  tmpO=tmpO.filter(o=>o.n!=n);tmpO.push({n,price:pr});tmpO.sort((x,y)=>x.n-y.n);$('#on').value=$('#op').value='';b.textContent='';renderO();return true};
$('#oadd').onclick=addO;$('#ofl').onclick=e=>{const b=e.target.closest('button');if(b){tmpO.splice(+b.dataset.ro,1);renderO()}};
const saveP=()=>{
  const err=m=>{const b=$('#pb');b.style.color='var(--warn)';b.textContent=m};
  try{
    if($('#on').value.trim()||$('#op').value.trim()){if(!addO())return}
    const name=$('#pn').value.trim(),price=num($('#pp').value),qty=num($('#pq').value),ca=$('#pa').value.trim(),cost=ca===''?null:num(ca),mn=$('#pm').value.trim()===''?0:num($('#pm').value);
    if(!name)return err('Entrez le nom du produit.');
    if(isNaN(price)||price<0)return err('Prix de vente invalide.');
    if(cost!==null&&(isNaN(cost)||cost<0))return err("Prix d'achat invalide.");
    if(isNaN(qty)||qty<0||qty%1)return err('Quantité en stock invalide (nombre entier).');
    if(isNaN(mn)||mn<0)return err("Seuil d'alerte invalide.");
    const v={name,ref:$('#pr').value.trim(),cat:$('#pc').value.trim(),cost,price,qty,min:mn,offers:tmpO.map(o=>({n:o.n,price:o.price}))};
    const old=edit&&S.products.find(p=>p.id==edit);
    if(old)Object.assign(old,v);else S.products.push({id:nid(),...v});
    save();$('#dlg').close();render();
  }catch(x){err('Erreur : '+x.message)}
};
$('#pf').onsubmit=e=>{e.preventDefault();saveP()};
$('#sv').onclick=saveP;
$('#pf').onkeydown=e=>{if(e.key=='Enter'&&e.target.tagName=='INPUT'){e.preventDefault();saveP()}};
$('#nav').onclick=e=>{const v=e.target.dataset.v;if(v){view=v;selS.clear();render()}};
$('#cur').onchange=e=>{S.cur=e.target.value;save();render()};
$('#app').onclick=e=>{
  const t=e.target.closest('button,input')||e.target,d=t.dataset;
  if(d.p){exportPdf(d.p);return}
  if(t.id=='fdset'){const v=$('#fd').value.trim()===''?0:num($('#fd').value);if(isNaN(v)||v<0)return note('Montant invalide.');S.fund=v;S.fundDate=$('#fdd').value?new Date($('#fdd').value+'T00:00:00').toISOString():new Date(new Date().setHours(0,0,0,0)).toISOString();save();render();note('Fonds de départ enregistré');return}
  if(t.id=='wadd'){const a=num($('#wm').value),r=$('#wr').value.trim();
    if(isNaN(a)||a<=0)return note('Entrez un montant valide.');if(!r)return note('Entrez le motif du retrait.');
    if(a>cashBal()+1e-9)return note('Solde de caisse insuffisant ('+money(cashBal())+').');
    S.withdrawals=S.withdrawals||[];S.withdrawals.push({id:nid(),amount:a,reason:r,date:new Date().toISOString(),payments:[]});save();render();note('Retrait enregistré');return}
  if(d.wp){const w=(S.withdrawals||[]).find(x=>x.id==d.wp);if(!w)return;const r=wRest(w),i=document.querySelector('[data-wpi="'+w.id+'"]').value.trim(),a=i===''?r:num(i);
    if(isNaN(a)||a<=0)return note('Montant invalide.');if(a>r+1e-9)return note('Le montant dépasse le reste à rembourser ('+money(r)+').');
    w.payments=w.payments||[];w.payments.push({id:nid(),amount:a,date:new Date().toISOString()});save();render();note(wRest(w)<=0?'Retrait entièrement remboursé':'Remboursement enregistré');return}
  if(t.id=='call'){$('#cm').value=Math.max(0,Math.round(cashBal()*100)/100);return}
  if(t.id=='cadd'){const a=num($('#cm').value),r=$('#cr').value.trim();
    if(isNaN(a)||a<=0)return note('Entrez un montant valide.');if(!r)return note('Entrez le motif du décaissement.');
    if(a>cashBal()+1e-9)return note('Solde de caisse insuffisant ('+money(cashBal())+').');
    S.cashouts=S.cashouts||[];S.cashouts.push({id:nid(),amount:a,reason:r,date:new Date().toISOString()});save();render();note('Décaissement enregistré');return}
  if(d.cd){const c=(S.cashouts||[]).find(x=>x.id==d.cd);if(c)ask('Supprimer ce décaissement ? Le montant sera remis dans la caisse.',()=>{S.cashouts=S.cashouts.filter(x=>x.id!=c.id);save();render();note('Décaissement supprimé')});return}
  if(d.wd){const w=(S.withdrawals||[]).find(x=>x.id==d.wd);if(w)ask('Supprimer ce retrait et ses remboursements ?',()=>{S.withdrawals=S.withdrawals.filter(x=>x.id!=w.id);save();render();note('Retrait supprimé')});return}
  if(d.mo){const id=Math.abs(+d.mo),add=+d.mo>0,p=S.products.find(x=>x.id==id);if(!p)return;
    const n=num(document.querySelector('[data-q="'+id+'"]').value);
    if(isNaN(n)||n<=0||n%1)return note('Quantité invalide.');
    if(!add&&n>p.qty)return note('Stock insuffisant : '+p.qty+' disponible(s).');
    let c=null,g=null,prev=p.cost;
    if(add){const ca=document.querySelector('[data-a="'+id+'"]').value.trim();c=ca===''?p.cost:num(ca);if(c!=null&&(isNaN(c)||c<0))return note("Prix d'achat invalide.");
      if(c!=null){p.cost=p.cost!=null&&p.qty>0?Math.round((p.cost*p.qty+c*n)/(p.qty+n)*100)/100:c;g=n*(p.price-c)}}
    p.qty+=add?n:-n;S.moves=S.moves||[];
    S.moves.push({id:nid(),pid:id,name:p.name,type:add?'add':'out',qty:n,cost:c,gain:g,prev:prev,nc:p.cost,note:($('#mm').value||'').trim(),date:new Date().toISOString()});
    save();render();note((add?'Ajouté : ':'Retiré : ')+n+' × '+p.name);return}
  if(d.mu){const m=(S.moves||[]).find(x=>x.id==d.mu),p=m&&S.products.find(x=>x.id==m.pid);if(!m||!p)return note('Produit introuvable.');
    if(m.type=='add'&&p.qty<m.qty)return note('Impossible : une partie de ce stock a déjà été vendue ou retirée.');
    p.qty+=m.type=='add'?-m.qty:m.qty;if(m.type=='add'&&p.cost===m.nc&&m.prev!==undefined)p.cost=m.prev;
    S.moves=S.moves.filter(x=>x.id!=m.id);save();render();note('Mouvement annulé');return}
  if(d.t){const p=S.products.find(x=>x.id==d.t);if(p&&(cart[p.id]||0)<p.qty){cart[p.id]=(cart[p.id]||0)+1;render()}return}
  if(d.pl){const p=S.products.find(x=>x.id==d.pl);if(p&&cart[p.id]<p.qty){cart[p.id]++;render()}return}
  if(d.m){cart[d.m]--;if(cart[d.m]<1)delete cart[d.m];render();return}
  if(d.rm){delete cart[d.rm];render();return}
  if(d.k!==undefined){scat=+d.k<0?'':catList()[+d.k];render();return}
  if(t.id=='clr'){cart={};render();return}
  if(t.id=='valid'){const E=Object.entries(cart).map(([id,n])=>[S.products.find(x=>x.id==id),n]);
    const bad=E.find(([p,n])=>!p||n>p.qty);if(bad)return note('Stock insuffisant'+(bad[0]?' pour '+bad[0].name:'')+'.');
    const now=new Date().toISOString();E.forEach(([p,n])=>{p.qty-=n;S.sales.push({id:nid(),pid:p.id,name:p.name,qty:n,price:p.price,cost:p.cost,tot:Math.round(lineTotal(p,n)*100)/100,date:now})});
    cart={};save();render();note('Vente enregistrée');return}
  if(d.c){t.checked?selS.add(+d.c):selS.delete(+d.c);updSel();return}
  if(t.id=='selall'){salesList().forEach(s=>t.checked?selS.add(s.id):selS.delete(s.id));render();return}
  if(t.id=='bulk'){const ids=selIds();if(ids.length)ask('Supprimer '+ids.length+' vente(s) ? Les quantités seront remises en stock.',()=>{ids.forEach(id=>{const s=S.sales.find(x=>x.id==id),p=s&&S.products.find(x=>x.id==s.pid);if(p)p.qty+=s.qty});S.sales=S.sales.filter(x=>!ids.includes(x.id));ids.forEach(id=>selS.delete(id));save();render();note(ids.length+' vente(s) supprimée(s)')});return}
  if(d.r){setRange(d.r);return}
  if(d.x2=='today'){dsel=ymd(new Date());render();return}
  if(d.d){dsel=d.d;render();window.scrollTo(0,0);return}
  if(d.x2)exportFile(d.x2);
  if(t.id=='add')openP();
  if(d.e)openP(S.products.find(p=>p.id==d.e));
  if(d.x)ask('Supprimer ce produit du stock ?',()=>{S.products=S.products.filter(p=>p.id!=d.x);save();render();note('Produit supprimé')});
  if(d.s){sort={k:d.s,d:sort.k==d.s?-sort.d:1};render()}
  if(t.id=='sell'){
    const p=S.products.find(x=>x.id==$('#sp').value),n=parseInt($('#sqn').value);
    if(!p||!(n>0))return note('Choisissez un produit et une quantité valide.');
    if(n>p.qty)return note('Stock insuffisant : il reste '+p.qty+' unité(s).');
    p.qty-=n;S.sales.push({id:nid(),pid:p.id,name:p.name,qty:n,price:p.price,cost:p.cost,date:new Date().toISOString()});save();render();
  }
  if(d.u)ask('Supprimer cette vente ? La quantité sera remise en stock.',()=>{
    const s=S.sales.find(x=>x.id==d.u),p=S.products.find(x=>x.id==s.pid);if(p)p.qty+=s.qty;
    S.sales=S.sales.filter(x=>x.id!=d.u);save();render();note('Vente annulée');
  });
};
render();
</script>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import {initializeFirestore,getFirestore,persistentLocalCache,persistentMultipleTabManager,collection,doc,onSnapshot,writeBatch} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";
import {getAuth,onAuthStateChanged,signInWithEmailAndPassword,signOut} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";

/* ====== 1) COLLEZ ICI LA CONFIG DE VOTRE PROJET FIREBASE ====== */
const FIREBASE_CONFIG={
  apiKey:"COLLEZ_ICI",
  authDomain:"VOTRE-PROJET.firebaseapp.com",
  projectId:"VOTRE-PROJET",
  storageBucket:"VOTRE-PROJET.appspot.com",
  messagingSenderId:"",
  appId:""
};
/* ================================================================ */

const COLS=['products','sales','moves','withdrawals','cashouts'],META=['cur','fund','fundDate'];
const sync=document.getElementById('sync');
const status=t=>{sync.textContent=t};
if(FIREBASE_CONFIG.apiKey.startsWith('COLLEZ')){status('Mode local')}else main();

function main(){
const app=initializeApp(FIREBASE_CONFIG);
let db;try{db=initializeFirestore(app,{localCache:persistentLocalCache({tabManager:persistentMultipleTabManager()})})}catch(e){db=getFirestore(app)}
const auth=getAuth(app);
const sk=v=>JSON.stringify(v,(k,x)=>x&&typeof x=='object'&&!Array.isArray(x)?Object.keys(x).sort().reduce((o,i)=>(o[i]=x[i],o),{}):x);
const clean=o=>JSON.parse(JSON.stringify(o));
const remote={},inc={},got={},srv={};
let metaStr=null,metaData=null,ready=false,started=false,pend=false;
const cache=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};

/* Rafraîchit l'écran sans casser une saisie en cours */
function refresh(){
  const a=document.activeElement,id=a&&a.id,keep=id=='q'||id=='sq';
  const typing=a&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)&&!keep;
  if(typing||document.querySelector('dialog[open]')){pend=true;return}
  pend=false;const p=keep?a.selectionStart:0;render();
  if(keep){const n=document.getElementById(id);if(n){n.focus();n.setSelectionRange(p,p)}}
}
document.addEventListener('focusout',()=>setTimeout(()=>{if(pend)refresh()},300));
document.addEventListener('close',()=>{if(pend)refresh()},true);

function applyMeta(){META.forEach(k=>{if(metaData&&k in metaData)S[k]=metaData[k];else delete S[k]})}
function adopt(){
  try{const p=localStorage.getItem(K);if(p&&!localStorage.getItem(K+'-avant-cloud'))localStorage.setItem(K+'-avant-cloud',p)}catch(e){}
  COLS.forEach(c=>{S[c]=inc[c]});applyMeta();cache();
}
function check(){
  if(ready||!got.meta||COLS.some(c=>!got[c]))return;
  if(metaData!==null||COLS.some(c=>inc[c].length)){adopt();ready=true;refresh()}
  else if(srv.meta&&COLS.every(c=>srv[c])){ready=true;push()} /* base vide : on envoie les données locales */
}
const stat=snap=>status(snap.metadata.fromCache?(navigator.onLine?'Synchronisation…':'● Hors ligne'):'● Synchronisé');
function onCol(c,snap){
  const m=new Map(),a=[];snap.forEach(d=>{const v=d.data();m.set(d.id,sk(v));a.push(v)});
  a.sort((x,y)=>x.id-y.id);remote[c]=m;inc[c]=a;got[c]=true;if(!snap.metadata.fromCache)srv[c]=true;stat(snap);
  if(ready){S[c]=a;cache();refresh()}else check();
}
function onMeta(snap){
  metaData=snap.exists()?snap.data():null;metaStr=metaData?sk(metaData):null;got.meta=true;if(!snap.metadata.fromCache)srv.meta=true;stat(snap);
  if(ready){applyMeta();cache();refresh()}else check();
}

/* Envoie uniquement ce qui a changé (ajouts, modifications, suppressions) */
function push(){
  const ops=[];
  COLS.forEach(c=>{
    const cur=new Map();(S[c]||[]).forEach(o=>cur.set(String(o.id),o));
    cur.forEach((o,id)=>{const v=clean(o),s=sk(v);if(remote[c].get(id)!==s){ops.push(['set',c,id,v]);remote[c].set(id,s)}});
    [...remote[c].keys()].forEach(id=>{if(!cur.has(id)){ops.push(['del',c,id]);remote[c].delete(id)}});
  });
  const mv=clean(Object.fromEntries(META.filter(k=>S[k]!==undefined).map(k=>[k,S[k]]))),ms=sk(mv);
  if(ms!==metaStr){ops.push(['meta',mv]);metaStr=ms}
  for(let i=0;i<ops.length;i+=400){
    const b=writeBatch(db);
    ops.slice(i,i+400).forEach(o=>o[0]=='set'?b.set(doc(db,o[1],o[2]),o[3]):o[0]=='del'?b.delete(doc(db,o[1],o[2])):b.set(doc(db,'meta','main'),o[1]));
    b.commit().catch(e=>{console.error(e);status('Erreur de synchro')});
  }
}
window.cloudPush=()=>{if(ready)push()};

function start(){
  const err=e=>{console.error(e);status('Erreur de synchro')};
  COLS.forEach(c=>onSnapshot(collection(db,c),s=>onCol(c,s),err));
  onSnapshot(doc(db,'meta','main'),onMeta,err);
}

/* Connexion (un compte e-mail / mot de passe créé dans la console Firebase) */
const ld=document.createElement('dialog');
ld.innerHTML='<form class="f"><h2 class="full">Connexion</h2><label class="full">E-mail<input id="le" type="email" autocomplete="username"></label><label class="full">Mot de passe<input id="lp" type="password" autocomplete="current-password"></label><div class="full" id="lm" style="color:var(--warn);font-size:13px"></div><div class="full row" style="justify-content:flex-end;margin:0"><button class="btn">Se connecter</button></div></form>';
document.body.appendChild(ld);
ld.addEventListener('cancel',e=>e.preventDefault());
ld.querySelector('form').onsubmit=async e=>{e.preventDefault();const m=ld.querySelector('#lm');m.textContent='';
  try{await signInWithEmailAndPassword(auth,ld.querySelector('#le').value.trim(),ld.querySelector('#lp').value)}catch(x){m.textContent='E-mail ou mot de passe incorrect.'}};
onAuthStateChanged(auth,u=>{
  if(u){if(ld.open)ld.close();status('Synchronisation…');if(!started){started=true;start()}}
  else{status('Non connecté');if(!ld.open)ld.showModal()}
});
sync.onclick=()=>{if(auth.currentUser)ask('Se déconnecter de la synchronisation ?',async()=>{await signOut(auth);location.reload()})};
addEventListener('offline',()=>status('● Hors ligne'));
addEventListener('online',()=>status('Synchronisation…'));
}
</script>
</body>
</html>
